name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (debug + release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null || \
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create .env for Gemini key
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/acef-debug.apk || true
          cp app/build/outputs/apk/release/app-release.apk artifacts/acef-release.apk || true
          ls -la artifacts

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: acef-debug-apk
          path: artifacts/acef-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: acef-release-apk
          path: artifacts/acef-release.apk
          if-no-files-found: warn

      - name: Create / Update GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-${{ github.run_number }}
          name: "آصف v2.0 (build ${{ github.run_number }})"
          body: |
            ## تطبيق آصف الإسلامي — الإصدار 2.0
            واجهة جديدة مستوحاة من Gemini (تدرجات لونية عصرية) وإصلاح جذري لانهيار التطبيق.

            - 🎨 واجهة عصرية بتصميم Gemini (أزرق → بنفسجي → وردي)
            - 🛠️ إصلاح انهيار التطبيق (توقيع، R8/ProGuard، Firebase غير مستخدم)
            - ⚙️ بناء عبر JDK 21 + Gradle 9.3.1 + AGP 9.1.1
          files: |
            artifacts/acef-release.apk
            artifacts/acef-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
